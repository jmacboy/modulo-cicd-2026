services:
  postgres:
    image: postgres:16-alpine
    # Values come from .env (copy .env.example to .env).
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container shell, which has these variables set.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./inventory-project
    environment:
      # Development enables Swagger and applies EF migrations on startup.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InventoryDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true"
    ports:
      - "5094:8080"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./react-client
      args:
        # The browser calls the API from the host, so this is the host-published port.
        VITE_API_URL: http://localhost:5094
    ports:
      # 5173 matches the origin allowed by the API CORS policy.
      - "5173:8080"
    depends_on:
      - api

volumes:
  postgres_data:
