# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: 21
        distribution: 'zulu' # Alternative distribution options are available.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Cache SonarQube Cloud packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    - name: Cache SonarQube Cloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}\scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install SonarQube Cloud scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      run: |
        dotnet tool install dotnet-sonarscanner --create-manifest-if-needed
    - name: Restore dependencies
      run: dotnet restore inventory-project/Inventory.sln
    - name: Sonar — Begin
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
        dotnet sonarscanner begin
        /k:"jmacboy_modulo-cicd-2026"
        /o:"jmacboy"
        /d:sonar.token="$SONAR_TOKEN"
        /d:sonar.host.url="https://sonarcloud.io"
        /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"
        /d:sonar.coverage.exclusions="**Tests*/**"
        /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**"
        /d:sonar.qualitygate.wait=true
    - name: Build
      run: dotnet build inventory-project/Inventory.sln --no-restore
    - name: Test
      run: > 
          dotnet test inventory-project/Inventory.sln --no-build
          --verbosity normal 
          --collect:"XPlat Code Coverage" 
          --results-directory ./coverage/backend
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura
    - name: Sonar — End
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      
    - name: Restore dotnet tools
      run: dotnet tool restore
    - name: Generate coverage report
      run: >
          dotnet tool run reportgenerator
          -reports:"./coverage/backend/**/coverage.cobertura.xml"
          -targetdir:"./coverage/backend/report"
          -reporttypes:Html
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage/backend/report
        retention-days: 7
